<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huma Aslam</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --main: #534AB7;
    --accent: #D4537E;
    --text: #1A1A1A;
    --bg: #FAFAF8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 4rem);
    color: var(--main);
  }
  p {
    margin-top: 0.75rem;
    font-size: 1rem;
    color: var(--text);
  }
  .accent {
    color: var(--accent);
  }
</style>
</head>
<body>
  <div>
    <h1>Huma Aslam</h1>
    <p>Machine Learning Intern <span class="accent">&middot;</span> Portfolio in progress</p>
  </div>
</body>
</html>
